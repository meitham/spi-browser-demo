name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emscripten-core/emsdk
          ref: 35659964bc2762fffec0d257997fb61475f765b7 # 6.0.13
          path: .cache/emsdk
      - name: Build and test
        run: |
          .cache/emsdk/emsdk install 6.0.13
          .cache/emsdk/emsdk activate 6.0.13
          source .cache/emsdk/emsdk_env.sh
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
